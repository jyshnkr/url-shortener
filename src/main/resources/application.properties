spring.application.name=url-shortener
server.address=127.0.0.1
server.port=8080
# A 2048-code-unit destination can expand to over 18 KB after UTF-8 percent encoding.
server.tomcat.max-http-response-header-size=32KB
shortener.base-url=http://localhost:8080
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/url_shortener
spring.datasource.username=url_shortener
spring.datasource.password=local-development-only
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1

spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Usage recording: kafka (default) or in-process (bounded in-memory queue, no broker needed).
shortener.analytics.transport=kafka
shortener.analytics.kafka.topic=link-redirects
spring.kafka.bootstrap-servers=127.0.0.1:9092
# Idempotent producer, acknowledged by all in-sync replicas. A redirect waits at most 50 ms
# for topic metadata or buffer space; delivery itself is confirmed asynchronously.
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=50
# Keep topic metadata through quiet periods so a later redirect does not wait to refetch it.
spring.kafka.producer.properties[metadata.max.idle.ms]=86400000
# Offsets are committed only after a batch's database transaction commits.
spring.kafka.consumer.group-id=url-shortener-analytics
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=1000
spring.kafka.listener.ack-mode=batch
# The publisher reports send failures as counters and a rate-limited warning instead.
logging.level.org.springframework.kafka.support.LoggingProducerListener=off
